name: Compilar APK de Kivy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar APK con Android Build
        uses: snisito/android-build-action@v1
        with:
          buildozer_version: master

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: paquete-apk
          path: bin/*.apk
